# ==============================================================================
# SonarQube Project Configuration - Hito 4
# ==============================================================================

# Identificación del proyecto en SonarQube
sonar.projectKey=padilla_nazareth_ibc_hito4
sonar.projectName=IBC - Nazareth Padilla - Hito 4
sonar.projectVersion=1.0

# Dirección del servidor SonarQube local
sonar.host.url=http://localhost:9000

# Codificación de archivos fuente
sonar.sourceEncoding=UTF-8

# Rutas de código fuente del sistema Laravel/PHP
sonar.sources=app,routes,database,config,resources

# Rutas de pruebas
sonar.tests=tests

# Exclusiones de análisis principal (código de pruebas exclusivo, dependencias, compilados, artefactos temporales, app móvil)
sonar.exclusions=tests/**,vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,public/vendor/**,mobile/**,scratch/**,docs/**,**/*.min.js,**/*.min.css
